<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>营销 KPI 看板</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f7f8fa;--bg3:#f0f2f5;
  --border:#e5e7eb;--border2:#d1d5db;
  --text:#111827;--text2:#6b7280;--text3:#9ca3af;
  --accent:#2563eb;--accent-bg:#eff6ff;
  --success:#059669;--success-bg:#ecfdf5;
  --danger:#dc2626;--danger-bg:#fef2f2;
  --warn:#d97706;--warn-bg:#fffbeb;
  --radius:8px;--radius-lg:12px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
html,body{background:#f9fafb;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh}

/* Upload */
#upload-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;padding:40px;background:#f9fafb}
.u-logo{font-size:11px;letter-spacing:.15em;color:var(--text3);text-transform:uppercase}
.u-title{font-size:26px;font-weight:300;color:var(--text);text-align:center;line-height:1.35}
.u-title b{font-weight:600;color:var(--accent)}
.drop-zone{width:100%;max-width:460px;border:2px dashed var(--border2);border-radius:var(--radius-lg);padding:44px 32px;text-align:center;cursor:pointer;background:#fff;transition:all .2s}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:var(--accent-bg)}
.drop-icon{font-size:32px;margin-bottom:10px;opacity:.35}
.drop-main{font-size:15px;font-weight:500;color:var(--text);margin-bottom:4px}
.drop-sub{font-size:13px;color:var(--text2);line-height:1.5}
.drop-hint{font-size:11px;color:var(--text3);margin-top:10px;font-family:'DM Mono',monospace}
#file-input{display:none}
.demo-btn{background:none;border:1.5px solid var(--border2);color:var(--text2);padding:7px 20px;border-radius:20px;cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;transition:all .2s}
.demo-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Dashboard */
#dashboard{display:none;flex-direction:column;min-height:100vh}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow)}
.header-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-size:13px;font-weight:600;color:var(--text);letter-spacing:-.01em}
.brand span{color:var(--accent)}
select{background:#fff;border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:6px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;outline:none;box-shadow:var(--shadow);transition:border-color .15s}
select:focus,select:hover{border-color:var(--accent)}
.reload-btn{background:#fff;border:1px solid var(--border);color:var(--text2);padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:var(--shadow);transition:all .15s;white-space:nowrap}
.reload-btn:hover{border-color:var(--accent);color:var(--accent)}
.data-info{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;white-space:nowrap}

/* Main */
.main{padding:20px 24px;display:flex;flex-direction:column;gap:14px}

/* KPI pills (multi-select) */
.kpi-row{display:flex;flex-wrap:wrap;gap:6px}
.kpi-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 13px;border-radius:20px;font-size:12px;cursor:pointer;
  border:1.5px solid var(--border);color:var(--text2);background:#fff;
  transition:all .15s;white-space:nowrap;box-shadow:var(--shadow);user-select:none;
}
.kpi-pill input[type=checkbox]{width:12px;height:12px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;margin:0}
.kpi-pill.active{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.kpi-pill:hover:not(.active){border-color:var(--accent);color:var(--accent)}

/* View tabs */
.view-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:2px}
.view-tab{padding:8px 18px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.view-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.view-tab:hover:not(.active){color:var(--text)}

/* Card */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)}

/* Section label */
.section-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);font-weight:500;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* Legend */
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)}

/* Chart */
.chart-wrap{position:relative;width:100%;height:260px}

/* Data table */
.data-table-wrap{margin-top:18px;overflow-x:auto;border-top:1px solid var(--border);padding-top:14px}
.data-table-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);font-weight:500;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:520px}
thead tr{background:var(--bg2)}
th{text-align:right;padding:7px 10px;color:var(--text2);font-weight:500;font-size:11px;border-bottom:1px solid var(--border);white-space:nowrap}
th:first-child,th:nth-child(2){text-align:left}
td{padding:6px 10px;border-bottom:1px solid var(--border);color:var(--text2);text-align:right;white-space:nowrap;font-family:'DM Mono',monospace;font-size:12px;vertical-align:top}
td.col-date{text-align:left;font-family:'DM Sans',sans-serif;color:var(--text);font-weight:500}
td.col-ch{text-align:left;font-family:'DM Sans',sans-serif}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg2)}
.cell-up{color:var(--danger);font-weight:500}
.cell-dn{color:var(--success);font-weight:500}

/* Alert */
.alert-wrap{overflow-x:auto}
.alert-table{min-width:480px}
.alert-table th,.alert-table td{text-align:left;font-family:'DM Sans',sans-serif}
tr.row-danger td{background:var(--danger-bg);color:var(--danger)}
tr.row-warn td{background:var(--warn-bg);color:var(--warn)}
.tag-up{color:var(--danger);font-family:'DM Mono',monospace;font-size:12px}
.tag-dn{color:var(--success);font-family:'DM Mono',monospace;font-size:12px}
.no-alert{padding:14px 4px;color:var(--success);font-size:13px;display:flex;align-items:center;gap:6px}

/* Presets */
.week-preset{background:#fff;border:1px solid var(--border);color:var(--text2);padding:3px 10px;border-radius:5px;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;transition:all .15s}
.week-preset:hover{border-color:var(--accent);color:var(--accent)}

.no-data{padding:40px;text-align:center;color:var(--text3);font-size:13px}
#loading{display:none;position:fixed;inset:0;background:rgba(255,255,255,.85);align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:10px}
#loading.show{display:flex}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--text2);font-size:13px}
</style>
</head>
<body>

<div id="upload-screen">
  <div class="u-logo">Marketing KPI Dashboard</div>
  <div class="u-title">拖入 <b>xlsx 文件</b><br>自动生成看板</div>
  <div class="drop-zone" id="drop-zone">
    <div class="drop-icon">⬆</div>
    <div class="drop-main">点击选择或拖拽文件到此</div>
    <div class="drop-sub">支持 .xlsx 格式，字段自动识别</div>
    <div class="drop-hint">渠道 · 时间 · 来源项目 · 消耗 · CTR · CPC · 回搜量 · 回搜率 · CPS · JD店铺成本 · 当日回搜量</div>
    <input type="file" id="file-input" accept=".xlsx,.xls">
  </div>
  <button class="demo-btn" onclick="loadDemo()">查看演示数据效果 →</button>
</div>

<div id="loading"><div class="spinner"></div><div class="loading-text">正在解析数据...</div></div>

<div id="dashboard">
  <div class="header">
    <div class="header-left">
      <div class="brand">KPI <span>Dashboard</span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <select id="sel-project" onchange="render()"><option value="ALL">全部项目</option></select>
        <select id="sel-channel" onchange="render()"><option value="ALL">全部渠道</option></select>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div class="data-info" id="data-info"></div>
      <button class="reload-btn" onclick="reloadFile()">↺ 更新数据</button>
    </div>
  </div>

  <div class="main">

    <!-- Tabs -->
    <div class="view-tabs">
      <div class="view-tab active" onclick="switchTab('daily',this)">日趋势</div>
      <div class="view-tab" onclick="switchTab('weekly',this)">周维度</div>
    </div>

    <!-- ══ Daily ══ -->
    <div id="view-daily">
      <div class="kpi-row" id="daily-kpi-pills" style="margin-bottom:12px"></div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">
        <span style="font-size:12px;color:var(--text2)">日期范围：</span>
        <input type="date" id="daily-date-start" onchange="onDailyRangeChange()" style="font-size:12px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-family:'DM Sans',sans-serif;color:var(--text);background:#fff;cursor:pointer">
        <span style="font-size:12px;color:var(--text3)">→</span>
        <input type="date" id="daily-date-end" onchange="onDailyRangeChange()" style="font-size:12px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-family:'DM Sans',sans-serif;color:var(--text);background:#fff;cursor:pointer">
        <div style="display:flex;gap:4px">
          <button class="week-preset" onclick="setDailyPreset(7)">近7天</button>
          <button class="week-preset" onclick="setDailyPreset(14)">近14天</button>
          <button class="week-preset" onclick="setDailyPreset(30)">近30天</button>
          <button class="week-preset" onclick="setDailyPreset(0)">全部</button>
        </div>
      </div>
      <div class="section-label">各渠道每日走势</div>
      <div class="card">
        <div class="legend" id="line-legend"></div>
        <div class="chart-wrap"><canvas id="line-chart"></canvas></div>
        <div class="data-table-wrap">
          <div class="data-table-label">明细数据</div>
          <div id="daily-table-wrap"></div>
        </div>
      </div>
      <div class="section-label" style="margin-top:4px">波动预警 &nbsp;环比 ±10% 触发</div>
      <div class="card"><div class="alert-wrap" id="alert-wrap"></div></div>
    </div>

    <!-- ══ Weekly ══ -->
    <div id="view-weekly" style="display:none">
      <div class="kpi-row" id="weekly-kpi-pills" style="margin-bottom:12px"></div>
      <div class="section-label">ISO 自然周（周一至周日）</div>

      <!-- 摘要卡 -->
      <div class="card" style="background:var(--bg2);border-radius:var(--radius-lg) var(--radius-lg) 0 0;border-bottom:none;margin-bottom:0">
        <!-- 摘要控件行 -->
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">
          <span style="font-size:12px;color:var(--text2);white-space:nowrap">摘要对比：</span>
          <select id="sel-summary-this" onchange="onSummaryChange()" style="font-size:12px;padding:3px 8px"></select>
          <span style="font-size:12px;color:var(--text3)">vs</span>
          <select id="sel-summary-vs" onchange="renderWeekly()" style="font-size:12px;padding:3px 8px"></select>
          <span style="font-size:11px;color:var(--text3);margin-left:4px">※ 修改此处会同步更新图表范围</span>
        </div>
        <div id="week-summary" style="font-size:13px;line-height:1.9;color:var(--text2)">
          <span style="color:var(--text3);font-size:12px">加载数据后自动生成摘要…</span>
        </div>
      </div>

      <!-- 周范围 + 图表 + 表格 -->
      <div class="card" style="border-radius:0 0 var(--radius-lg) var(--radius-lg);border-top:1px dashed var(--border);margin-top:0">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap">
          <span style="font-size:12px;color:var(--text2)">图表范围：</span>
          <select id="sel-week-start" onchange="onWeekRangeChange()" style="font-size:12px;padding:4px 8px"></select>
          <span style="font-size:12px;color:var(--text3)">→</span>
          <select id="sel-week-end" onchange="onWeekRangeChange()" style="font-size:12px;padding:4px 8px"></select>
          <div style="display:flex;gap:4px;margin-left:4px">
            <button class="week-preset" onclick="setWeekPreset(4)">近4周</button>
            <button class="week-preset" onclick="setWeekPreset(8)">近8周</button>
            <button class="week-preset" onclick="setWeekPreset(0)">全部</button>
          </div>
        </div>
        <div class="section-label">各渠道周趋势</div>
        <div class="legend" id="week-legend"></div>
        <div class="chart-wrap"><canvas id="week-chart"></canvas></div>
        <div class="data-table-wrap">
          <div class="data-table-label">周维度明细</div>
          <div id="weekly-table-wrap"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
let RAW=[];
let activeTab='daily';
let activeKPIs=['消耗'];
let activeWeekKPIs=['消耗'];
let lineChart=null;
let weekChart=null;

const ALL_KPIS=['消耗','CTR','CPC','回搜量','回搜率','CPS','JD店铺成本','当日回搜量','当日回搜率','当日回搜成本'];
const WEEK_KPIS=['消耗','CTR','CPC','回搜量','回搜率','CPS','JD店铺成本']; // 周维度不含当日回搜三项
const RATIO_KPIS=new Set(['CTR','回搜率','当日回搜率']);

const LINE_PALETTE=[
  '#2563eb','#059669','#d97706','#7c3aed','#db2777','#0891b2',
  '#65a30d','#ea580c','#0d9488','#9333ea','#e11d48','#0284c7',
  '#16a34a','#ca8a04','#7e22ce','#be185d','#0369a1','#15803d'
];
const CH_DASH={SEM:[],FEEDS:[6,4],Feeds:[6,4],'发现页':[3,3],OTHER:[4,2]};
const CH_COLOR={SEM:'#2563eb',FEEDS:'#059669',Feeds:'#059669','发现页':'#d97706',OTHER:'#7c3aed'};

function normCh(c){return c==='Feeds'?'FEEDS':c}
function isoWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
  const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil((((t-y0)/86400000)+1)/7);
}
function parseDate(s){
  if(!s)return null;
  if(s instanceof Date){if(isNaN(s))return null;return s;}
  const str=String(s).replace(/\//g,'-').trim();
  const m=str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  return null;
}
function localStr(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fmtDate(d){return`${d.getMonth()+1}/${d.getDate()}`}

function fmt(v,kpi){
  if(v==null||isNaN(v))return'—';
  if(['CTR','回搜率','当日回搜率'].includes(kpi))return(v*100).toFixed(2)+'%';
  if(['CPC','CPE','CPM','CPS','JD店铺成本','当日回搜成本'].includes(kpi))return'¥'+v.toFixed(2);
  return v>=10000?(v/10000).toFixed(1)+'w':Math.round(v).toLocaleString();
}

function sumCol(rows,col){
  const vals=rows.map(r=>parseFloat(r[col])).filter(v=>!isNaN(v));
  return vals.length?vals.reduce((a,b)=>a+b,0):null;
}

function aggVal(rows,kpi){
  if(!rows.length)return null;
  switch(kpi){
    case '消耗':         return sumCol(rows,'消耗');
    case '展现量':       return sumCol(rows,'展现量');
    case '点击量':       return sumCol(rows,'点击量');
    case '回搜量':       return sumCol(rows,'回搜量');
    case '当日回搜量':   return sumCol(rows,'当日回搜量');
    case 'CTR':{const c=sumCol(rows,'点击量'),i=sumCol(rows,'展现量');return(c!=null&&i&&i!==0)?c/i:null}
    case 'CPC':{const c=sumCol(rows,'消耗'),k=sumCol(rows,'点击量');return(c!=null&&k&&k!==0)?c/k:null}
    case '回搜率':{const s=sumCol(rows,'回搜量'),c=sumCol(rows,'点击量');return(s!=null&&c&&c!==0)?s/c:null}
    case 'CPS':{const c=sumCol(rows,'消耗'),s=sumCol(rows,'回搜量');return(c!=null&&s&&s!==0)?c/s:null}
    case 'JD店铺成本':{const s=sumCol(rows,'小红盟消耗'),u=sumCol(rows,'JD站外行为量');return(s!=null&&u&&u!==0)?s/u:null}
    case '当日回搜率':{const s=sumCol(rows,'当日回搜量'),c=sumCol(rows,'点击量');return(s!=null&&c&&c!==0)?s/c:null}
    case '当日回搜成本':{const c=sumCol(rows,'消耗'),s=sumCol(rows,'当日回搜量');return(c!=null&&s&&s!==0)?c/s:null}
    default:{const vals=rows.map(r=>parseFloat(r[kpi])).filter(v=>!isNaN(v));return vals.length?vals.reduce((a,b)=>a+b,0):null}
  }
}

function calcChange(cur,prev,kpi){
  if(cur==null||prev==null)return null;
  if(RATIO_KPIS.has(kpi))return{type:'abs',val:cur-prev};
  if(prev===0)return null;
  return{type:'rel',val:(cur-prev)/Math.abs(prev)};
}
function fmtChange(ch,kpi){
  if(!ch)return'';
  const isUp=ch.val>0,cls=isUp?'cell-up':'cell-dn';
  if(ch.type==='abs'){const pp=(Math.abs(ch.val)*100).toFixed(2);return`<br><span class="${cls}" style="font-size:10px">${isUp?'▲':'▼'}${pp}pp</span>`}
  const pct=(Math.abs(ch.val)*100).toFixed(1);return`<br><span class="${cls}" style="font-size:10px">${isUp?'▲':'▼'}${pct}%</span>`;
}
function isAlerted(ch){if(!ch)return false;return ch.type==='abs'?Math.abs(ch.val)>=0.001:Math.abs(ch.val)>=0.1}
function isBigAlert(ch){if(!ch)return false;return ch.type==='abs'?Math.abs(ch.val)>=0.002:Math.abs(ch.val)>=0.2}

/* ── File IO ── */
function readFile(file){
  showLoading(true);
  const r=new FileReader();
  r.onload=e=>{
    try{const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];RAW=XLSX.utils.sheet_to_json(ws,{defval:null});initDashboard()}
    catch(err){alert('解析失败：'+err.message)}
    showLoading(false);
  };r.readAsArrayBuffer(file);
}
function showLoading(v){document.getElementById('loading').classList.toggle('show',v)}

function loadDemo(){
  showLoading(true);
  const projs=['PHP','LINGYI','NS'],chs=['SEM','FEEDS','发现页'],rows=[];
  const now=new Date('2026-06-02');
  for(let d=55;d>=0;d--){
    const dt=new Date(now);dt.setDate(now.getDate()-d);
    for(const proj of projs)for(const ch of chs){
      const base={SEM:9000,FEEDS:5500,'发现页':3200}[ch];
      const spike=Math.random()<0.06?1.5+Math.random()*.8:1;
      const clk=Math.floor(800+Math.random()*400);
      const imp=Math.floor(clk/(0.02+Math.random()*0.02));
      const srch=Math.floor(clk*(0.06+Math.random()*.1));
      const dsrch=Math.floor(clk*(0.05+Math.random()*.08));
      rows.push({渠道:ch,时间:dt,消耗:+(base+(Math.random()-.5)*2000)*spike,
        点击量:clk,展现量:imp,
        回搜量:srch,当日回搜量:dsrch,
        CPS:+(55+Math.random()*35),'JD店铺成本':+(80+Math.random()*45),来源项目:proj});
    }
  }
  RAW=rows;
  setTimeout(()=>{initDashboard();showLoading(false);},300);
}

/* ── Init ── */
function initDashboard(){
  const projs=[...new Set(RAW.map(r=>r['来源项目']).filter(Boolean))];
  const chs=[...new Set(RAW.map(r=>normCh(r['渠道'])).filter(Boolean))];
  const sp=document.getElementById('sel-project'),sc=document.getElementById('sel-channel');
  sp.innerHTML='<option value="ALL">全部项目</option>'+projs.map(p=>`<option>${p}</option>`).join('');
  sc.innerHTML='<option value="ALL">全部渠道</option>'+chs.map(c=>`<option>${c}</option>`).join('');
  const dates=RAW.map(r=>parseDate(r['时间'])).filter(Boolean).sort((a,b)=>a-b);
  if(dates.length){
    const s=dates[0],e=dates[dates.length-1];
    document.getElementById('data-info').textContent=`${RAW.length}行 · ${s.getFullYear()}-${s.getMonth()+1}-${s.getDate()} ~ ${e.getFullYear()}-${e.getMonth()+1}-${e.getDate()}`;
  }

  // Build daily KPI pills
  document.getElementById('daily-kpi-pills').innerHTML=ALL_KPIS.map(k=>`
    <label class="kpi-pill${activeKPIs.includes(k)?' active':''}">
      <input type="checkbox" ${activeKPIs.includes(k)?'checked':''} onchange="toggleKPI('daily','${k}',this)">
      ${k}
    </label>`).join('');

  // Build weekly KPI pills (no 当日回搜 three)
  document.getElementById('weekly-kpi-pills').innerHTML=WEEK_KPIS.map(k=>`
    <label class="kpi-pill${activeWeekKPIs.includes(k)?' active':''}">
      <input type="checkbox" ${activeWeekKPIs.includes(k)?'checked':''} onchange="toggleKPI('weekly','${k}',this)">
      ${k}
    </label>`).join('');

  initDailyDatePicker();
  populateWeekSels();
  document.getElementById('upload-screen').style.display='none';
  document.getElementById('dashboard').style.display='flex';
  render();
}

function toggleKPI(tab,kpi,cb){
  if(tab==='daily'){
    if(cb.checked){if(!activeKPIs.includes(kpi))activeKPIs.push(kpi)}
    else{if(activeKPIs.length>1)activeKPIs=activeKPIs.filter(k=>k!==kpi);else{cb.checked=true;return}}
    cb.closest('.kpi-pill').classList.toggle('active',cb.checked);
  } else {
    if(cb.checked){if(!activeWeekKPIs.includes(kpi))activeWeekKPIs.push(kpi)}
    else{if(activeWeekKPIs.length>1)activeWeekKPIs=activeWeekKPIs.filter(k=>k!==kpi);else{cb.checked=true;return}}
    cb.closest('.kpi-pill').classList.toggle('active',cb.checked);
  }
  render();
}

/* ── Date pickers ── */
function initDailyDatePicker(){
  const dates=RAW.map(r=>parseDate(r['时间'])).filter(Boolean).sort((a,b)=>a-b);
  if(!dates.length)return;
  const minD=localStr(dates[0]),maxD=localStr(dates[dates.length-1]);
  const s=document.getElementById('daily-date-start'),e=document.getElementById('daily-date-end');
  s.min=minD;s.max=maxD;e.min=minD;e.max=maxD;
  const end=new Date(dates[dates.length-1]);
  const start=new Date(end);start.setDate(end.getDate()-13);
  s.value=localStr(start<dates[0]?dates[0]:start);e.value=maxD;
}
function setDailyPreset(n){
  const dates=RAW.map(r=>parseDate(r['时间'])).filter(Boolean).sort((a,b)=>a-b);
  if(!dates.length)return;
  const e=document.getElementById('daily-date-end'),s=document.getElementById('daily-date-start');
  const maxD=localStr(dates[dates.length-1]);e.value=maxD;
  if(n===0){s.value=localStr(dates[0])}
  else{const end=new Date(dates[dates.length-1]);const st=new Date(end);st.setDate(end.getDate()-(n-1));s.value=localStr(st<dates[0]?dates[0]:st)}
  render();
}
function onDailyRangeChange(){
  const s=document.getElementById('daily-date-start').value,e=document.getElementById('daily-date-end').value;
  if(s&&e&&s>e)document.getElementById('daily-date-end').value=s;
  render();
}

/* ── Week selectors ── */
function populateWeekSels(){
  const weekSet=new Set();
  RAW.forEach(r=>{const d=parseDate(r['时间']);if(d)weekSet.add(isoWeek(d))});
  const allWeeks=[...weekSet].sort((a,b)=>a-b);
  const opts=allWeeks.map(w=>`<option value="${w}">W${w}</option>`).join('');

  ['sel-week-start','sel-week-end','sel-summary-this','sel-summary-vs'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.innerHTML=opts;
  });

  if(allWeeks.length){
    const last=allWeeks[allWeeks.length-1];
    const prev=allWeeks.length>=2?allWeeks[allWeeks.length-2]:allWeeks[0];
    const rangeStart=allWeeks[Math.max(0,allWeeks.length-4)];
    const ss=document.getElementById('sel-week-start');if(ss)ss.value=rangeStart;
    const se=document.getElementById('sel-week-end');if(se)se.value=last;
    const st=document.getElementById('sel-summary-this');if(st)st.value=last;
    const sv=document.getElementById('sel-summary-vs');if(sv)sv.value=prev;
  }
}
function onSummaryChange(){
  // 摘要"当前周"→ 图表终止周；摘要"对比周"→ 图表起始周
  const thisWn=parseInt(document.getElementById('sel-summary-this').value||0);
  const vsWn=parseInt(document.getElementById('sel-summary-vs').value||0);
  const se=document.getElementById('sel-week-end');
  const ss=document.getElementById('sel-week-start');
  if(se&&thisWn)se.value=thisWn;
  if(ss&&vsWn)ss.value=vsWn;
  // also sync sel-summary-vs if needed
  renderWeekly();
}
function onWeekRangeChange(){
  const ss=document.getElementById('sel-week-start'),se=document.getElementById('sel-week-end');
  if(parseInt(ss.value)>parseInt(se.value))se.value=ss.value;
  renderWeekly();
}
function setWeekPreset(n){
  const weekSet=new Set();RAW.forEach(r=>{const d=parseDate(r['时间']);if(d)weekSet.add(isoWeek(d))});
  const allWeeks=[...weekSet].sort((a,b)=>a-b);
  if(!allWeeks.length)return;
  const ei=allWeeks.length-1,si=n===0?0:Math.max(0,ei-(n-1));
  const ss=document.getElementById('sel-week-start'),se=document.getElementById('sel-week-end');
  ss.value=allWeeks[si];se.value=allWeeks[ei];renderWeekly();
}

function filtered(){
  const proj=document.getElementById('sel-project').value;
  const ch=document.getElementById('sel-channel').value;
  return RAW.filter(r=>{
    if(proj!=='ALL'&&r['来源项目']!==proj)return false;
    if(ch!=='ALL'&&normCh(r['渠道'])!==ch)return false;
    return true;
  });
}
function reloadFile(){const inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls';inp.onchange=e=>{if(e.target.files[0])readFile(e.target.files[0])};inp.click()}
function switchTab(tab,el){
  activeTab=tab;
  document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');
  document.getElementById('view-daily').style.display=tab==='daily'?'':'none';
  document.getElementById('view-weekly').style.display=tab==='weekly'?'':'none';
  render();
}
function render(){if(activeTab==='daily')renderDaily();else renderWeekly()}

/* ══════════════════════════════════
   DAILY
══════════════════════════════════ */
function renderDaily(){
  const data=filtered();
  const startVal=document.getElementById('daily-date-start').value;
  const endVal=document.getElementById('daily-date-end').value;
  let recent=data;
  if(startVal&&endVal)recent=data.filter(r=>{const d=parseDate(r['时间']);return d&&localStr(d)>=startVal&&localStr(d)<=endVal});

  const allDates=[...new Set(recent.map(r=>{const d=parseDate(r['时间']);return d?localStr(d):null}).filter(Boolean))].sort().reverse(); // 最新日期在上
  const channels=[...new Set(recent.map(r=>normCh(r['渠道'])).filter(Boolean))];
  const chOrder={SEM:0,FEEDS:1};
  const sortedCh=[...channels].sort((a,b)=>(chOrder[a]??99)-(chOrder[b]??99));
  const labels=allDates.map(d=>fmtDate(new Date(d)));

  function getAgg(dt,ch,kpi){return aggVal(recent.filter(r=>{const d=parseDate(r['时间']);return d&&localStr(d)===dt&&normCh(r['渠道'])===ch}),kpi)}
  function getDayTotal(dt,kpi){return aggVal(recent.filter(r=>{const d=parseDate(r['时间']);return d&&localStr(d)===dt}),kpi)}

  const multiKPI=activeKPIs.length>1;
  const kpiRange={};
  if(multiKPI){
    activeKPIs.forEach(kpi=>{
      const vals=[];
      sortedCh.forEach(ch=>allDates.forEach(dt=>{const v=getAgg(dt,ch,kpi);if(v!=null&&!isNaN(v))vals.push(v)}));
      const mn=Math.min(...vals),mx=Math.max(...vals);
      kpiRange[kpi]={min:mn,max:mx===mn?mn+1:mx};
    });
  }
  function normalize(v,kpi){
    if(v==null||isNaN(v))return null;
    if(!multiKPI)return v;
    const {min,max}=kpiRange[kpi];return((v-min)/(max-min))*100;
  }

  // Datasets: one line per channel×KPI
  const datasets=[];let lineIdx=0;
  activeKPIs.forEach(kpi=>{
    sortedCh.forEach(ch=>{
      const col=LINE_PALETTE[lineIdx%LINE_PALETTE.length];lineIdx++;
      const dash=CH_DASH[ch]||[];
      const rawData=allDates.map(dt=>getAgg(dt,ch,kpi));
      datasets.push({label:`${ch} · ${kpi}`,data:rawData.map(v=>normalize(v,kpi)),rawData,kpi,
        borderColor:col,backgroundColor:col+'18',borderWidth:2,
        pointRadius:3,pointHoverRadius:5,borderDash:dash,tension:.3,fill:false,spanGaps:true});
    });
  });

  // Legend
  let li=0;
  const legendItems=[];
  activeKPIs.forEach(kpi=>{
    sortedCh.forEach(ch=>{
      const col=LINE_PALETTE[li%LINE_PALETTE.length];li++;
      const dash=CH_DASH[ch]||[];
      legendItems.push(`<div class="legend-item"><div style="width:22px;height:0;border-top:2px ${dash.length?'dashed':'solid'} ${col};flex-shrink:0"></div><span>${ch} · ${kpi}</span></div>`);
    });
  });
  legendItems.push(`<div class="legend-item" style="margin-left:8px;border-left:1px solid var(--border);padding-left:12px"><div style="width:18px;height:0;border-top:2.5px solid #9ca3af;flex-shrink:0"></div><span style="color:var(--text3)">SEM实线</span></div>`);
  legendItems.push(`<div class="legend-item"><div style="width:18px;height:0;border-top:2px dashed #9ca3af;flex-shrink:0"></div><span style="color:var(--text3)">FEEDS虚线</span></div>`);
  document.getElementById('line-legend').innerHTML=legendItems.join('');

  if(lineChart)lineChart.destroy();
  lineChart=new Chart(document.getElementById('line-chart'),{
    type:'line',data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{
        backgroundColor:'#fff',borderColor:'#e5e7eb',borderWidth:1,
        titleColor:'#6b7280',bodyColor:'#111827',padding:10,
        callbacks:{label:ctx=>{const ds=ctx.dataset;const real=ds.rawData?ds.rawData[ctx.dataIndex]:ctx.raw;return`  ${ds.label}: ${fmt(real,ds.kpi||activeKPIs[0])}`}}
      }},
      scales:{
        x:{ticks:{color:'#9ca3af',font:{size:11},maxRotation:45,autoSkip:false},grid:{color:'#f3f4f6'}},
        y:{ticks:{color:'#9ca3af',font:{size:11},callback:v=>multiKPI?v.toFixed(0)+'%':fmt(v,activeKPIs[0])},grid:{color:'#f3f4f6'},
          ...(multiKPI?{min:0,max:100,title:{display:true,text:'归一化（各KPI独立缩放）',color:'#9ca3af',font:{size:10}}}:{})}
      }
    }
  });

  // Table: date × channel rows + total row per date
  const tableWrap=document.getElementById('daily-table-wrap');
  if(!allDates.length){tableWrap.innerHTML='<div class="no-data">暂无数据</div>';return}
  let headerCols='';activeKPIs.forEach(kpi=>{headerCols+=`<th>${kpi}</th>`});

  const bodyRows=allDates.map((dt,di)=>{
    const label=labels[di];let rows='';
    sortedCh.forEach((ch,ci)=>{
      const chColor=CH_COLOR[ch]||'#9ca3af';const chDash=CH_DASH[ch]||[];
      const lineStyle=chDash.length?`border-top:2px dashed ${chColor};width:18px;height:0;display:inline-block`:`border-top:2.5px solid ${chColor};width:18px;height:0;display:inline-block`;
      const chLabel=`<div style="display:flex;align-items:center;gap:5px"><span style="${lineStyle}"></span><span>${ch}</span></div>`;
      const dateTd=ci===0?`<td class="col-date" rowspan="${sortedCh.length+1}" style="vertical-align:middle;border-right:1px solid var(--border)">${label}</td>`:'';
      let kpiCells='';
      activeKPIs.forEach(kpi=>{
        const cur=getAgg(dt,ch,kpi);const prev=di>0?getAgg(allDates[di-1],ch,kpi):null;
        kpiCells+=`<td>${fmt(cur,kpi)}${fmtChange(calcChange(cur,prev,kpi),kpi)}</td>`;
      });
      rows+=`<tr style="${ci===0?'border-top:2px solid var(--border)':''}">${dateTd}<td class="col-ch" style="white-space:nowrap;padding:6px 10px">${chLabel}</td>${kpiCells}</tr>`;
    });
    // Total row
    let totCells='';
    activeKPIs.forEach(kpi=>{
      const cur=getDayTotal(dt,kpi);const prev=di>0?getDayTotal(allDates[di-1],kpi):null;
      totCells+=`<td style="font-weight:600;color:var(--text)">${fmt(cur,kpi)}${fmtChange(calcChange(cur,prev,kpi),kpi)}</td>`;
    });
    rows+=`<tr style="background:var(--bg2)"><td class="col-ch" style="padding:6px 10px;font-weight:600;color:var(--text2);font-size:11px">合计</td>${totCells}</tr>`;
    return rows;
  }).join('');
  tableWrap.innerHTML=`<table><thead><tr><th>日期</th><th>渠道</th>${headerCols}</tr></thead><tbody>${bodyRows}</tbody></table>`;

  buildAlerts(allDates,sortedCh,labels,getAgg);
}

/* ── Alerts ── */
function buildAlerts(allDates,channels,labels,getAgg){
  const rows=[];
  for(let i=1;i<allDates.length;i++){
    for(const ch of channels){
      const prev=getAgg(allDates[i-1],ch,'消耗'),cur=getAgg(allDates[i],ch,'消耗');
      if(prev==null||cur==null||prev===0)continue;
      const chg=calcChange(cur,prev,'消耗');
      if(chg&&isAlerted(chg))rows.push({date:labels[i],ch,prev,cur,chg});
    }
  }
  const wrap=document.getElementById('alert-wrap');
  if(!rows.length){wrap.innerHTML=`<div class="no-alert">✓ 所选日期范围内无 ±10% 以上波动（消耗）</div>`;return}
  const bigRows=rows.filter(r=>isBigAlert(r.chg)).sort((a,b)=>Math.abs(b.chg.val)-Math.abs(a.chg.val));
  const warnRows=rows.filter(r=>!isBigAlert(r.chg)).sort((a,b)=>Math.abs(b.chg.val)-Math.abs(a.chg.val));
  function buildRow(r,cls){
    const isUp=r.chg.val>0;const pct=Math.abs(r.chg.val*100).toFixed(1);
    return`<tr class="${cls}"><td>${r.date}</td><td>${r.ch}</td><td>${fmt(r.prev,'消耗')}</td><td>${fmt(r.cur,'消耗')}</td><td><span class="${isUp?'tag-up':'tag-dn'}">${isUp?'▲ +':'▼ -'}${pct}%</span></td></tr>`;
  }
  const thead=`<thead><tr><th>日期</th><th>渠道</th><th>前日</th><th>当日</th><th>变化</th></tr></thead>`;
  let html='';
  if(bigRows.length)html+=`<div style="font-size:11px;color:var(--danger);font-weight:500;padding:8px 10px 4px;letter-spacing:.05em">⚠ 重大波动</div><table class="alert-table">${thead}<tbody>${bigRows.map(r=>buildRow(r,'row-danger')).join('')}</tbody></table>`;
  if(warnRows.length)html+=`<div style="font-size:11px;color:var(--warn);font-weight:500;padding:${bigRows.length?'14px':'8px'} 10px 4px;letter-spacing:.05em">⚡ 一般波动</div><table class="alert-table">${thead}<tbody>${warnRows.map(r=>buildRow(r,'row-warn')).join('')}</tbody></table>`;
  wrap.innerHTML=html;
}

/* ══════════════════════════════════
   WEEKLY
══════════════════════════════════ */
function renderWeekly(){
  const data=filtered();
  const weekSet=new Set();data.forEach(r=>{const d=parseDate(r['时间']);if(d)weekSet.add(isoWeek(d))});
  const allWeeks=[...weekSet].sort((a,b)=>a-b);

  const startWn=parseInt(document.getElementById('sel-week-start').value||0);
  const endWn=parseInt(document.getElementById('sel-week-end').value||0);
  const visibleWeeks=allWeeks.filter(w=>w>=startWn&&w<=endWn);

  const channels=[...new Set(data.map(r=>normCh(r['渠道'])).filter(Boolean))];
  const chOrder={SEM:0,FEEDS:1};
  const sortedCh=[...channels].sort((a,b)=>(chOrder[a]??99)-(chOrder[b]??99));
  const labels=visibleWeeks.map(w=>`W${w}`);

  function wAgg(wn,ch,kpi){return aggVal(data.filter(r=>{const d=parseDate(r['时间']);return d&&isoWeek(d)===wn&&normCh(r['渠道'])===ch}),kpi)}
  function wTotal(wn,kpi){return aggVal(data.filter(r=>{const d=parseDate(r['时间']);return d&&isoWeek(d)===wn}),kpi)}

  // ── 摘要（用户选定的两周对比）──
  const thisWn=parseInt(document.getElementById('sel-summary-this').value||0);
  const vsWn=parseInt(document.getElementById('sel-summary-vs').value||0);
  buildWeeklySummary(data,thisWn,vsWn);

  if(!visibleWeeks.length){
    document.getElementById('week-legend').innerHTML='';
    document.getElementById('weekly-table-wrap').innerHTML='<div class="no-data">暂无数据</div>';
    if(weekChart)weekChart.destroy();return;
  }

  const multiKPI=activeWeekKPIs.length>1;
  const kpiRange={};
  if(multiKPI){
    activeWeekKPIs.forEach(kpi=>{
      const vals=[];
      sortedCh.forEach(ch=>visibleWeeks.forEach(wn=>{const v=wAgg(wn,ch,kpi);if(v!=null&&!isNaN(v))vals.push(v)}));
      const mn=Math.min(...vals),mx=Math.max(...vals);
      kpiRange[kpi]={min:mn,max:mx===mn?mn+1:mx};
    });
  }
  function normalize(v,kpi){
    if(v==null||isNaN(v))return null;
    if(!multiKPI)return v;
    const {min,max}=kpiRange[kpi];return((v-min)/(max-min))*100;
  }

  // Datasets
  const datasets=[];let lineIdx=0;
  activeWeekKPIs.forEach(kpi=>{
    sortedCh.forEach(ch=>{
      const col=LINE_PALETTE[lineIdx%LINE_PALETTE.length];lineIdx++;
      const dash=CH_DASH[ch]||[];
      const rawData=visibleWeeks.map(wn=>wAgg(wn,ch,kpi));
      datasets.push({label:`${ch} · ${kpi}`,data:rawData.map(v=>normalize(v,kpi)),rawData,kpi,
        borderColor:col,backgroundColor:col+'18',borderWidth:2,
        pointRadius:4,pointHoverRadius:6,borderDash:dash,tension:.3,fill:false,spanGaps:true});
    });
  });

  // Legend
  let li=0;const legendItems=[];
  activeWeekKPIs.forEach(kpi=>{
    sortedCh.forEach(ch=>{
      const col=LINE_PALETTE[li%LINE_PALETTE.length];li++;
      const dash=CH_DASH[ch]||[];
      legendItems.push(`<div class="legend-item"><div style="width:22px;height:0;border-top:2px ${dash.length?'dashed':'solid'} ${col};flex-shrink:0"></div><span>${ch} · ${kpi}</span></div>`);
    });
  });
  document.getElementById('week-legend').innerHTML=legendItems.join('');

  if(weekChart)weekChart.destroy();
  weekChart=new Chart(document.getElementById('week-chart'),{
    type:'line',data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{
        backgroundColor:'#fff',borderColor:'#e5e7eb',borderWidth:1,
        titleColor:'#6b7280',bodyColor:'#111827',padding:10,
        callbacks:{label:ctx=>{const ds=ctx.dataset;const real=ds.rawData?ds.rawData[ctx.dataIndex]:ctx.raw;return`  ${ds.label}: ${fmt(real,ds.kpi||activeWeekKPIs[0])}`}}
      }},
      scales:{
        x:{ticks:{color:'#9ca3af',font:{size:11}},grid:{color:'#f3f4f6'}},
        y:{ticks:{color:'#9ca3af',font:{size:11},callback:v=>multiKPI?v.toFixed(0)+'%':fmt(v,activeWeekKPIs[0])},grid:{color:'#f3f4f6'},
          ...(multiKPI?{min:0,max:100,title:{display:true,text:'归一化（各KPI独立缩放）',color:'#9ca3af',font:{size:10}}}:{})}
      }
    }
  });

  // Table: week × channel rows + total
  const tableWrap=document.getElementById('weekly-table-wrap');
  let headerCols='';activeWeekKPIs.forEach(kpi=>{headerCols+=`<th>${kpi}</th>`});

  const bodyRows=visibleWeeks.map((wn,wi)=>{
    let rows='';
    sortedCh.forEach((ch,ci)=>{
      const chColor=CH_COLOR[ch]||'#9ca3af';const chDash=CH_DASH[ch]||[];
      const lineStyle=chDash.length?`border-top:2px dashed ${chColor};width:18px;height:0;display:inline-block`:`border-top:2.5px solid ${chColor};width:18px;height:0;display:inline-block`;
      const chLabel=`<div style="display:flex;align-items:center;gap:5px"><span style="${lineStyle}"></span><span>${ch}</span></div>`;
      const dateTd=ci===0?`<td class="col-date" rowspan="${sortedCh.length+1}" style="vertical-align:middle;border-right:1px solid var(--border)">W${wn}</td>`:'';
      let kpiCells='';
      activeWeekKPIs.forEach(kpi=>{
        const cur=wAgg(wn,ch,kpi);const prev=wi>0?wAgg(visibleWeeks[wi-1],ch,kpi):null;
        kpiCells+=`<td>${fmt(cur,kpi)}${fmtChange(calcChange(cur,prev,kpi),kpi)}</td>`;
      });
      rows+=`<tr style="${ci===0?'border-top:2px solid var(--border)':''}">${dateTd}<td class="col-ch" style="white-space:nowrap;padding:6px 10px">${chLabel}</td>${kpiCells}</tr>`;
    });
    let totCells='';
    activeWeekKPIs.forEach(kpi=>{
      const cur=wTotal(wn,kpi);const prev=wi>0?wTotal(visibleWeeks[wi-1],kpi):null;
      totCells+=`<td style="font-weight:600;color:var(--text)">${fmt(cur,kpi)}${fmtChange(calcChange(cur,prev,kpi),kpi)}</td>`;
    });
    rows+=`<tr style="background:var(--bg2)"><td class="col-ch" style="padding:6px 10px;font-weight:600;color:var(--text2);font-size:11px">合计</td>${totCells}</tr>`;
    return rows;
  }).join('');
  tableWrap.innerHTML=`<table><thead><tr><th>周次</th><th>渠道</th>${headerCols}</tr></thead><tbody>${bodyRows}</tbody></table>`;
}

/* ── Weekly Summary ── */
function buildWeeklySummary(data,thisWn,vsWn){
  const el=document.getElementById('week-summary');if(!el)return;
  if(!thisWn||!vsWn){el.innerHTML='<span style="color:var(--text3);font-size:12px">请选择对比周次</span>';return}

  const projFilter=document.getElementById('sel-project').value;
  const projects=projFilter!=='ALL'?[projFilter]:[...new Set(data.map(r=>r['来源项目']).filter(Boolean))].sort();

  function wProjAgg(wn,proj,kpi){
    return aggVal(data.filter(r=>{
      const d=parseDate(r['时间']);
      if(!d||isoWeek(d)!==wn)return false;
      if(proj&&r['来源项目']!==proj)return false;
      return true;
    }),kpi);
  }

  function fmtMil(v){if(v==null||isNaN(v))return'—';return(v/1000000).toFixed(2)+'M'}
  function fmtNum(v){if(v==null||isNaN(v))return'—';return v>=10000?(v/10000).toFixed(1)+'w':Math.round(v).toLocaleString()}
  function fmtPct(cur,prev){
    if(cur==null||prev==null||prev===0)return'';
    const pct=(cur-prev)/Math.abs(prev)*100;
    const col=pct>=0?'var(--danger)':'var(--success)';
    return`<span style="color:${col};font-size:12px">${pct>=0?'▲':'▼'}${pct>=0?'+':''}${pct.toFixed(1)}%</span>`;
  }

  const lines=projects.map(proj=>{
    const thisCost=wProjAgg(thisWn,proj,'消耗'),vsCost=wProjAgg(vsWn,proj,'消耗');
    const thisSrch=wProjAgg(thisWn,proj,'回搜量'),vsSrch=wProjAgg(vsWn,proj,'回搜量');
    return`<div style="padding:3px 0;border-bottom:1px solid var(--border);margin-bottom:2px">
      <span style="font-weight:600;color:var(--accent);min-width:60px;display:inline-block">【${proj}】</span>
      消耗 <b>${fmtMil(thisCost)}</b> vs <b>${fmtMil(vsCost)}</b> ${fmtPct(thisCost,vsCost)}
      <span style="margin:0 8px;color:var(--border2)">·</span>
      回搜 <b>${fmtNum(thisSrch)}</b> vs <b>${fmtNum(vsSrch)}</b> ${fmtPct(thisSrch,vsSrch)}
    </div>`;
  });

  el.innerHTML=`<div style="font-size:11px;color:var(--text3);margin-bottom:8px">W${thisWn} vs W${vsWn} · 消耗单位：百万元</div>`+lines.join('');
}

/* ── Wiring ── */
const dz=document.getElementById('drop-zone'),fi=document.getElementById('file-input');
dz.addEventListener('click',()=>fi.click());
fi.addEventListener('change',e=>{if(e.target.files[0])readFile(e.target.files[0])});
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover')});
dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('dragover');const f=e.dataTransfer.files[0];if(f)readFile(f)});
</script>
</body>
</html>
